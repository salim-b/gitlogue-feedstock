context:
  version: "0.11.0"

package:
  name: gitlogue
  version: ${{ version }}

source:
  url: https://github.com/unhappychoice/gitlogue/archive/refs/tags/v${{ version }}.tar.gz
  sha256: cf0814005bd39c02b7c48d385a258e2e4e1fd57980bb57db72ecb490494de06c

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      LIBGIT2_NO_VENDOR: "1"
      OPENSSL_NO_VENDOR: "1"
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - make
    - nushell
    - pkg-config
  host:
    - if: unix
      then: libgit2

tests:
  - script:
      - gitlogue --help
      - gitlogue --version
  - package_contents:
      bin:
        - gitlogue
      strict: true

about:
  summary: A cinematic Git commit replay tool for the terminal
  description: |
    Gitlogue is a terminal-based screensaver that replays Git commits as if a
    ghost developer were typing each change by hand. It provides realistic
    typing animations, syntax highlighting, and file tree transitions.
  license: ISC
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/unhappychoice/gitlogue
  documentation: https://github.com/unhappychoice/gitlogue/tree/main/docs
  repository: https://github.com/unhappychoice/gitlogue

extra:
  recipe-maintainers:
    - salim-b
